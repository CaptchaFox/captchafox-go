name: Release

# Runs when a version tag is pushed: checks that the tag is on main and has a changelog entry, runs the tests and creates
# the GitHub release. The Go module proxy serves the version by the tag alone, so these checks stop only the GitHub
# release, not the version.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency: release

jobs:
  release:
    name: Release ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    permissions:
      # Creates the GitHub release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, so that the check below can see whether the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - name: Check that the tag points to a commit on main
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} points to $(git rev-parse --short HEAD), which is not on main. Tag the tested commit on main."
            exit 1
          fi

      - name: Check the tag and the changelog
        run: .github/scripts/check-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/notes.md"

      # The oldest supported Go, which the go directive of go.mod names.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "CaptchaFox for Go ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/notes.md"
